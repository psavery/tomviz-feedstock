# libprotobuf 7.35.1 (global pinning since the absl_grpc_proto_26Q2 migration)
# and the paraview 6.1.1 builds linked against it need macOS 12.0. This file
# shadows the value the migration carried, so it has to be bumped here by hand.
c_stdlib_version:          # [osx]
  - 12.0                   # [osx]
MACOSX_SDK_VERSION:        # [osx]
  - '12.3'                 # [osx]

c_compiler:                # [win]
  - vs2022                 # [win]
cxx_compiler:              # [win]
  - vs2022                 # [win]

vtk:
  - '9.6'

# TEMPORARY, REMOVE BEFORE MERGE: tomviz-pipeline >=3.1.3 is held on the
# tomviz_pipeline_dev label until the tomviz release that needs it ships.
# Lets CI resolve the new run dependency; the label flips to main on release
# day, and this must be gone before this PR merges.
channel_sources:
  - conda-forge/label/tomviz_pipeline_dev,conda-forge
